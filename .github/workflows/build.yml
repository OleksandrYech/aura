name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.7

defaults:
  run:
    working-directory: app

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aura .
        working-directory: .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # CanvasKit из сборки, без запросов к CDN Google.
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: aura-web
          path: app/build/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # ponytail: подписано debug-ключом, свой ключ нужен только для Google Play.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: aura-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Без подписи: для установки на iPhone нужен Apple Developer аккаунт.
      - run: flutter build ios --release --no-codesign

name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.7

defaults:
  run:
    working-directory: app

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aura .
        working-directory: .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # CanvasKit из сборки, без запросов к CDN Google.
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: aura-web
          path: app/build/web

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # обычно ~12 минут; зависшая сборка не должна съедать минуты Actions
    permissions:
      contents: write # публикация релиза
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Подписываем постоянным ключом из секретов; без них (PR из форка, локально) — debug-ключом.
      - name: Ключ подписи
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/aura.jks"
          echo "AURA_KEYSTORE=$RUNNER_TEMP/aura.jks" >> "$GITHUB_ENV"
      # Номер сборки растёт с каждым запуском: Android ставит APK поверх, только если versionCode больше.
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.1.${{ github.run_number }}
        env:
          AURA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: aura-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      # Каждая сборка main — релиз, его подхватывает Obtainium на телефоне.
      - name: Релиз
        if: github.ref == 'refs/heads/main' && env.AURA_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk aura.apk
          gh release create v0.1.${{ github.run_number }} aura.apk --target ${{ github.sha }} --title "AURA 0.1.${{ github.run_number }}" --notes "$NOTES"

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Без подписи: для установки на iPhone нужен Apple Developer аккаунт.
      - run: flutter build ios --release --no-codesign

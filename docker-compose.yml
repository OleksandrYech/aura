services:
  aura:
    build: .
    restart: unless-stopped
    volumes:
      - aura-data:/data
    # Для проверки в локальной сети: http://<IP сервера>:8080
    ports:
      - "8080:8080"

  # Доступ из интернета через Cloudflare Tunnel. Токен туннеля положите в файл .env:
  # TUNNEL_TOKEN=...
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - aura
    profiles: [tunnel]

volumes:
  aura-data:

name: aura
description: "AURA — мессенджер со сквозным шифрованием."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audioplayers: ^6.8.1
  cross_file: ^0.3.5+5
  device_info_plus: ^13.3.0
  fc_native_video_thumbnail: ^3.0.1
  file_picker: ^13.1.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.2+hotfix.4
  http: ^1.6.0
  image: ^4.12.0
  libsignal_protocol_dart: ^0.8.2
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  record: ^7.1.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  v_video_compressor: ^2.2.3
  video_player: ^2.14.1
  web: ^1.1.1
  web_socket_channel: ^3.0.3
  webcrypto: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa-Bold.ttf
          weight: 700
    - family: Ubuntu
      fonts:
        - asset: assets/fonts/Ubuntu-Light.ttf
          weight: 300
        - asset: assets/fonts/Ubuntu-Regular.ttf
        - asset: assets/fonts/Ubuntu-Medium.ttf
          weight: 500
